<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p>signup form</p>

    <div>
        <input type="text" id="sp_name" placeholder="name" required>
        <input type="text" id="sp_pass" placeholder="pass" required>
        <input type="text" id="sp_role" placeholder="role" required>
        <button onclick="signup()"> signup </button>
    </div>

    <br><br><br><br><br>

    <p>login form</p>

    <div>
        <input type="text" id="ln_name" placeholder="name" required>
        <input type="text" id="ln_pass" placeholder="pass" required>
        <button onclick="login()"> login </button>
    </div>

    <br><br><br><br><br>

    <button onclick="getProfile()">Get Profile</button>

    <script>
        let s_url = "http://localhost:5000";

        async function signup() {

            const name = document.getElementById("sp_name").value;
            const password = document.getElementById("sp_pass").value;
            const role = document.getElementById("sp_role").value;

            const body = {
                name: name,
                password: password,
                role: role
            };

            const resp = await fetch(s_url + "/api/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            const data = await resp.json();

            alert(data.status);
        }

        async function login() {

            const name = document.getElementById("ln_name").value;
            const password = document.getElementById("ln_pass").value;

            const body = {
                name: name,
                password: password
            };

            const resp = await fetch(s_url + "/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            const data = await resp.json();

            if (resp.ok) {
                localStorage.setItem("token",data.token)
                alert("Login successful");
            } else {
                alert(data.status);
            }
        }

        async function getProfile() {

            const token = localStorage.getItem("token")

            const resp = await fetch(s_url + "/api/profile", {
                method: "GET",
                headers: {
                    "Authorization": token
                }
            });

            const data = await resp.json();

            if (resp.ok) {
                alert(JSON.stringify(data, null, 2));
            } else {
                alert(data.status);
            }
        }
    </script>

</body>
</html>
